# yamllint config for docker-compose files.
extends: default

rules:
  # Compose `command: >` folded blocks and long image refs run past 80 cols.
  line-length:
    max: 160
    level: warning
  # Prettier owns indentation/spacing; don't double-fight it.
  indentation:
    spaces: 2
    indent-sequences: true
  document-start: disable
  comments:
    min-spaces-from-content: 1
  # `enable: "true"` label values are quoted strings, not booleans — fine.
  truthy:
    check-keys: false

ignore: |
  .git/
