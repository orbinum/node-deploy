# Orbinum Testnet — public RPC node.
#
# What the public endpoint (rpc-1, rpc-2, …) serves: wallets, the explorer and
# anyone querying the chain. Caddy terminates HTTPS/WSS in front of it with a
# Cloudflare Origin Certificate, so the node itself speaks plain HTTP on
# RPC_PORT and is never exposed directly.
#
# `methods=safe` on each endpoint: a public endpoint must not offer
# author_rotateKeys, offchain storage or the other unsafe namespaces. The binary
# forces `--rpc-methods Unsafe` (for the ISMP relayer), which only governs
# --rpc-port; an endpoint's own `methods=` is what applies to it. ISMP queries
# work under `safe`. Archive on both axes
# (--state-pruning / --blocks-pruning) so historical queries answer.
#
# Two RPC endpoints, because Caddy limits HTTP per client IP but can only count
# WebSocket *connections*, not the calls inside one:
#   - RPC_PORT (HTTP, and local clients): no per-connection limit — Caddy pools
#     many users onto a few upstream connections, so one would throttle them all.
#     Binds on RPC_BIND: all interfaces here, because the relayer reads this node
#     over the private network (see .env.example).
#   - RPC_WS_PORT (loopback, Caddy's WSS upstream): `rate-limit` caps the calls
#     each socket may make per minute; subscription notifications do not count.
# `--experimental-rpc-endpoint` replaces --rpc-port/--rpc-external/--rpc-cors/
# --rpc-methods/--rpc-max-connections, which cannot be combined with it.
# No `cors=` on an endpoint: setting one also turns on the node's Host filter,
# which admits only localhost and rejects Caddy's forwarded public Host
# ("Provided Host header is not whitelisted"). Caddy sets CORS itself.
# `max-request-size`/`max-response-size` 150 MiB, as the binary forces for
# --rpc-port: an endpoint does not inherit it, and the 15 MiB default truncates
# the large GRANDPA proofs the relayer fetches.
#
# Three containers, one purpose: the node, Caddy for TLS, and Watchtower to
# keep the image current. See the Watchtower block for how a failed update
# recovers on its own.

services:
  orbinum-rpc-node:
    image: ${ORBINUM_IMAGE:-ghcr.io/orbinum/node:testnet-latest}
    platform: linux/amd64
    container_name: orbinum-rpc-node
    network_mode: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: >
      --chain /chain-specs/testnet-spec.json
      --name "${RPC_NAME:?set RPC_NAME in .env, the name telemetry shows for this node}"
      --base-path /data
      --listen-addr /ip4/0.0.0.0/tcp/${P2P_PORT:-30333}
      --node-key ${RPC_NODE_KEY}
      ${RESERVED_NODES}
      ${TELEMETRY_URL---telemetry-url "wss://telemetry.orbinum.io/submit/ 0"}
      --experimental-rpc-endpoint "listen-addr=${RPC_BIND:-0.0.0.0}:${RPC_PORT:-9944},methods=safe,max-request-size=150,max-response-size=150,max-connections=3500"
      --experimental-rpc-endpoint "listen-addr=127.0.0.1:${RPC_WS_PORT:-9945},methods=safe,max-request-size=150,max-response-size=150,max-connections=1500,rate-limit=${RPC_WS_RATE_LIMIT:-1200}"
      --in-peers 64
      --out-peers 16
      --state-pruning archive
      --blocks-pruning archive
      --no-mdns
      --no-private-ipv4
      --prometheus-external
      --prometheus-port ${METRICS_PORT:-9615}
      --log info
    volumes:
      - rpc-node-data:/data
      - ../chainspec/testnet-spec.json:/chain-specs/testnet-spec.json:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf -m 3
          -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","id":1,"method":"system_health"}'
          http://127.0.0.1:${RPC_PORT:-9944} >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    mem_limit: ${RPC_MEM_LIMIT:-6g}
    cpus: ${RPC_CPUS:-1.5}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  caddy:
    build:
      context: ../../common
      dockerfile: Caddy.Dockerfile
    image: orbinum-caddy-ratelimit:2
    container_name: orbinum-caddy
    network_mode: host
    restart: unless-stopped
    environment:
      RPC_DOMAIN: ${RPC_DOMAIN:-rpc.example.invalid}
      RPC_PORT: ${RPC_PORT:-9944}
      RPC_WS_PORT: ${RPC_WS_PORT:-9945}
    volumes:
      - ../../common/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./origin.pem:/etc/caddy/origin.pem:ro
      - ./origin.key:/etc/caddy/origin.key:ro
      - caddy-data:/data
      - caddy-config:/config
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: orbinum-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      # A container a bad image left `created` or `restarting` is invisible to a default
      # Watchtower — it scans running containers only — so it stays down until a human
      # visits the host. That is what rc.23 cost. These three make it part of the scan
      # and start it once a fixed image is published under the same tag.
      WATCHTOWER_INCLUDE_STOPPED: "true"
      WATCHTOWER_REVIVE_STOPPED: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # Keep the previous image on disk. Cleanup deleted it during the rc.23 rollout,
      # which is what turned "roll back with one command" into "no way back": the tag
      # served a broken image and the good one was gone.
      WATCHTOWER_CLEANUP: "false"
      WATCHTOWER_LOG_LEVEL: "info"
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  rpc-node-data:
  caddy-data:
  caddy-config:
