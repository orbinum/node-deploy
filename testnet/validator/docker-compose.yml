services:
  orbinum-validator:
    image: ${ORBINUM_IMAGE:-ghcr.io/orbinum/node:testnet-latest}
    platform: linux/amd64
    container_name: orbinum-validator
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: >
      --chain /chain-specs/testnet-spec.json
      --name "${VALIDATOR_NAME:-Orbinum-Validator}"
      --base-path /data
      --listen-addr /ip4/0.0.0.0/tcp/${P2P_PORT:-30333}
      --validator
      --node-key ${VALIDATOR_NODE_KEY}
      ${PUBLIC_ADDR}
      ${RESERVED_NODES}
      ${TELEMETRY_URL---telemetry-url "wss://telemetry.orbinum.io/submit/ 1"}
      --rpc-port 9944
      --rpc-methods Unsafe
      ${RPC_EXTERNAL}
      --no-mdns
      --prometheus-external
      --prometheus-port 9615
      --log info
    volumes:
      - ../chainspec/testnet-spec.json:/chain-specs/testnet-spec.json:ro
      - validator-data:/data
    ports:
      - "${P2P_BIND:-0.0.0.0}:${P2P_PORT:-30333}:${P2P_PORT:-30333}"
      - "${RPC_BIND:-127.0.0.1}:${RPC_PORT:-9944}:9944"
      - "${METRICS_BIND:-127.0.0.1}:${METRICS_PORT:-9615}:9615"
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: orbinum-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_LOG_LEVEL: "info"
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  validator-data:
