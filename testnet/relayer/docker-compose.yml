# Orbinum Testnet — Hyperbridge relayer (Tesseract).
#
# Tesseract exchanges GRANDPA finality proofs with Hyperbridge so the two chains can
# verify each other, and carries ISMP messages between them. It holds no authority: a
# forged proof is rejected by verification on the receiving side. Postman, not notary.
#
# This stack runs no node. Tesseract reaches Orbinum over the network, and which endpoint
# it uses is decided in relayer.toml — see relayer.toml.example, which explains why that
# endpoint must be an ARCHIVE node and what breaks silently when it is not.
#
# Deploy:
#   cp .env.example .env
#   cp relayer.toml.example relayer.toml
#   $EDITOR relayer.toml          # both signer lines, and the Orbinum endpoint
#   docker compose up -d
#
# Check it is working — this must climb:
#
#   curl -s -H 'Content-Type: application/json' \
#     -d '{"jsonrpc":"2.0","id":1,"method":"ismp_queryStateMachineLatestHeight",
#          "params":[{"state_id":"SUBSTRATE-orbi","consensus_state_id":"ORBI"}]}' \
#     https://gargantua.rpc.polytope.technology

services:
  tesseract:
    image: polytopelabs/tesseract:latest
    platform: linux/amd64
    container_name: orbinum-tesseract
    # host networking so private-network addresses resolve directly, without a bridge
    # hop. Tesseract listens on nothing — every connection it makes is outbound.
    network_mode: host
    command: >
      --config=/data/relayer.toml
      --db=/data/relayer.db
    volumes:
      - ./relayer.toml:/data/relayer.toml:ro
      - tesseract-data:/data
    restart: unless-stopped
    mem_limit: ${TESSERACT_MEM_LIMIT:-2g}
    cpus: ${TESSERACT_CPUS:-1.0}
    # No auto-updater watches this stack. Tesseract is upstream's image on a floating
    # `latest`, and a silent swap mid-flight would be harder to attribute than a
    # deliberate `docker pull`. Update it on purpose:
    #   docker compose pull tesseract && docker compose up -d tesseract
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  tesseract-data:
