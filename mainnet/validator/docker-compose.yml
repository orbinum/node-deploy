services:
  orbinum-validator:
    image: ${ORBINUM_IMAGE:-ghcr.io/orbinum/node:mainnet-latest}
    platform: linux/amd64
    container_name: orbinum-validator
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # TELEMETRY_URL reports to telemetry.orbinum.io by default (the dashboard
    # that reads it is telemetry.orbinum.network). It uses
    # `${VAR-default}`, NOT `${VAR:-default}`: only the hyphen-alone form
    # treats an EMPTY TELEMETRY_URL as "opt out" rather than falling back to
    # the default. A comment cannot go inside the `command: >` block below —
    # folded scalars have no comments, so it would be passed as arguments.
    command: >
      --chain /chain-specs/mainnet-spec.json
      --name "${VALIDATOR_NAME:-Orbinum-Validator}"
      --base-path /data
      --listen-addr /ip4/0.0.0.0/tcp/30333
      --validator
      --node-key ${VALIDATOR_NODE_KEY}
      ${TELEMETRY_URL---telemetry-url "wss://telemetry.orbinum.io/submit/ 1"}
      --rpc-port 9944
      --rpc-methods Unsafe
      --no-mdns
      --prometheus-external
      --prometheus-port 9615
      --log info
    volumes:
      - ../chainspec/mainnet-spec.json:/chain-specs/mainnet-spec.json:ro
      - validator-data:/data
    ports:
      - "${P2P_BIND:-0.0.0.0}:30333:30333"
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: orbinum-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_LOG_LEVEL: "info"
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  validator-data:
