# Orbinum Mainnet — validator.
#
# Authors blocks on mainnet. Same reasoning as testnet/validator: unsafe RPC is
# acceptable only because it is unpublished and reachable just via `docker
# exec`, which is how session keys are inserted. TCP 30333 must be reachable.
#
# Higher stakes than testnet: session keys are real, and the image follows
# `mainnet-latest`, which only a stable (non-prerelease) tag publishes.

services:
  orbinum-validator:
    image: ${ORBINUM_IMAGE:-ghcr.io/orbinum/node:mainnet-latest}
    platform: linux/amd64
    container_name: orbinum-validator
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: >
      --chain /chain-specs/mainnet-spec.json
      --name "${VALIDATOR_NAME:-Orbinum-Validator}"
      --base-path /data
      --listen-addr /ip4/0.0.0.0/tcp/${P2P_PORT:-30333}
      --validator
      --node-key ${VALIDATOR_NODE_KEY}
      ${PUBLIC_ADDR}
      ${RESERVED_NODES}
      ${TELEMETRY_URL---telemetry-url "wss://telemetry.orbinum.io/submit/ 1"}
      --rpc-port 9944
      --rpc-methods Unsafe
      ${RPC_EXTERNAL}
      --no-mdns
      --prometheus-external
      --prometheus-port ${METRICS_PORT:-9615}
      --log info
    volumes:
      - ../chainspec/mainnet-spec.json:/chain-specs/mainnet-spec.json:ro
      - validator-data:/data
    ports:
      - "${P2P_BIND:-0.0.0.0}:${P2P_PORT:-30333}:${P2P_PORT:-30333}"
      - "${RPC_BIND:-127.0.0.1}:${RPC_PORT:-9944}:9944"
      - "${METRICS_BIND:-127.0.0.1}:${METRICS_PORT:-9615}:${METRICS_PORT:-9615}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf -m 3
          -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","id":1,"method":"system_health"}'
          http://127.0.0.1:9944 >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: orbinum-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      # A container a bad image left `created` or `restarting` is invisible to a default
      # Watchtower — it scans running containers only — so it stays down until a human
      # visits the host. That is what rc.23 cost. These three make it part of the scan
      # and start it once a fixed image is published under the same tag.
      WATCHTOWER_INCLUDE_STOPPED: "true"
      WATCHTOWER_REVIVE_STOPPED: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # Keep the previous image on disk. Cleanup deleted it during the rc.23 rollout,
      # which is what turned "roll back with one command" into "no way back": the tag
      # served a broken image and the good one was gone.
      WATCHTOWER_CLEANUP: "false"
      WATCHTOWER_LOG_LEVEL: "info"
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  validator-data:
