# Orbinum Mainnet — public RPC node.
#
# Same shape as testnet/rpc, pointed at the mainnet image and chain spec: the
# node behind Caddy for TLS, `--rpc-methods Safe` because the endpoint is
# public, archive pruning so historical queries answer.
#
# The image tag differs on purpose (`mainnet-latest`): a stable `vX.Y.Z` tag
# publishes it, a prerelease never does, so an rc can never reach mainnet by
# following a floating tag.

services:
  orbinum-rpc-node:
    image: ${ORBINUM_IMAGE:-ghcr.io/orbinum/node:mainnet-latest}
    platform: linux/amd64
    container_name: orbinum-rpc-node
    network_mode: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: >
      --chain /chain-specs/mainnet-spec.json
      --name "${RPC_NAME:-Orbinum-RPC}"
      --base-path /data
      --listen-addr /ip4/0.0.0.0/tcp/${P2P_PORT:-30333}
      --node-key ${RPC_NODE_KEY}
      ${RESERVED_NODES}
      ${TELEMETRY_URL---telemetry-url "wss://telemetry.orbinum.io/submit/ 0"}
      --rpc-port ${RPC_PORT:-9944}
      --rpc-cors all
      --rpc-external
      --rpc-methods Safe
      --rpc-max-connections 5000
      --state-pruning archive
      --blocks-pruning archive
      --no-mdns
      --no-private-ipv4
      --prometheus-external
      --prometheus-port ${METRICS_PORT:-9615}
      --log info
    volumes:
      - rpc-node-data:/data
      - ../chainspec/mainnet-spec.json:/chain-specs/mainnet-spec.json:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf -m 3
          -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","id":1,"method":"system_health"}'
          http://127.0.0.1:${RPC_PORT:-9944} >/dev/null
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    mem_limit: ${RPC_MEM_LIMIT:-6g}
    cpus: ${RPC_CPUS:-1.5}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  caddy:
    build:
      context: ../../common
      dockerfile: Caddy.Dockerfile
    image: orbinum-caddy-ratelimit:2
    container_name: orbinum-caddy
    network_mode: host
    restart: unless-stopped
    environment:
      RPC_DOMAIN: ${RPC_DOMAIN:-rpc.example.invalid}
      RPC_PORT: ${RPC_PORT:-9944}
    volumes:
      - ../../common/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./origin.pem:/etc/caddy/origin.pem:ro
      - ./origin.key:/etc/caddy/origin.key:ro
      - caddy-data:/data
      - caddy-config:/config
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: orbinum-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      # A container a bad image left `created` or `restarting` is invisible to a default
      # Watchtower — it scans running containers only — so it stays down until a human
      # visits the host. That is what rc.23 cost. These three make it part of the scan
      # and start it once a fixed image is published under the same tag.
      WATCHTOWER_INCLUDE_STOPPED: "true"
      WATCHTOWER_REVIVE_STOPPED: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # Keep the previous image on disk. Cleanup deleted it during the rc.23 rollout,
      # which is what turned "roll back with one command" into "no way back": the tag
      # served a broken image and the good one was gone.
      WATCHTOWER_CLEANUP: "false"
      WATCHTOWER_LOG_LEVEL: "info"
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  rpc-node-data:
  caddy-data:
  caddy-config:
